name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # electron-builder sube los instaladores a la release

jobs:
  # La release se crea ANTES de compilar, y como borrador. Dos motivos:
  #
  #  - Si cada plataforma intentara crearla por su cuenta, varios trabajos en
  #    paralelo competirían por el mismo tag y acabarían saliendo dos borradores
  #    con los ficheros repartidos (y un latest.yml perdido, que es justo lo que
  #    rompe el autoactualizador).
  #  - En borrador, nadie se descarga una versión a medio subir.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crear la release en borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --repo "$GITHUB_REPOSITORY" \
                 --draft --title "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          # macOS y Linux quedan comentados hasta que se puedan probar de
          # verdad. Publicar un binario que nadie ha abierto nunca es peor que
          # no publicarlo.
          # - os: macos-latest
          #   flag: --mac
          # - os: ubuntu-latest
          #   flag: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los modelos de reconocimiento no se versionan: pesan decenas de megas y
      # no son código. Se descargan aquí, fijados por sha256 en
      # scripts/models.lock.json, y electron-builder los empaqueta como
      # `extraResources`. Sin este paso el escáner sale del instalador sin
      # motor.
      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: resources/models
          key: models-${{ hashFiles('scripts/models.lock.json') }}

      - name: Descargar modelos
        run: npm run models:fetch

      # `npm run build` es comprobar tipos + electron-vite build, y es quien
      # genera out/. Sin este paso, electron-builder empaqueta un asar vacío y
      # muere con «Application entry file out/main/index.js ... was not found».
      # electron-builder sólo empaqueta: no compila nada.
      - name: Comprobar tipos y compilar
        run: npm run build

      - name: Empaquetar y publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.flag }} --publish always

  # Sin esto la release se queda en borrador para siempre y electron-updater no
  # la ve: sólo mira la última release publicada.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
          echo "Publicada: $(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
